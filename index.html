<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELMONDO SHOWROOM & DECOR | الأثاث والديكور</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Config for Custom Theme Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        belmondo: {
                            green: '#0a382c',
                            darkgreen: '#05221b',
                            lightgreen: '#125241',
                            gold: '#c5a059',
                            lightgold: '#e0c388',
                            darkgold: '#9e7b36',
                            cream: '#f9f6f0',
                            cardbg: '#0f2d24'
                        }
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #05221b; color: #f9f6f0; }
        .gold-gradient-text { background: linear-gradient(135deg, #e0c388 0%, #c5a059 50%, #9e7b36 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-gradient-bg { background: linear-gradient(135deg, #e0c388 0%, #c5a059 50%, #9e7b36 100%); }
        .gold-border { border-color: #c5a059; }
        .glass-header { background: rgba(10, 56, 44, 0.85); backdrop-filter: blur(12px); }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-6px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(197, 160, 89, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-belmondo-gold selection:text-belmondo-darkgreen">

    <!-- Navbar Header -->
    <header class="glass-header sticky top-0 z-40 border-b border-belmondo-gold/20 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-full border border-belmondo-gold flex items-center justify-center bg-belmondo-darkgreen">
                    <span class="font-serif text-belmondo-gold font-bold text-xl">B</span>
                </div>
                <div>
                    <h1 class="font-serif font-extrabold text-xl md:text-2xl tracking-wider text-white">BELMONDO</h1>
                    <p class="text-[10px] text-belmondo-gold tracking-widest font-light uppercase">Showroom & Decor</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="openAdminModal()" class="border border-belmondo-gold/40 text-belmondo-lightgold hover:bg-belmondo-gold hover:text-belmondo-darkgreen px-3.5 py-1.5 rounded-full text-xs font-semibold transition duration-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-[11px]"></i>
                    <span>لوحة الإدارة</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="relative py-12 md:py-16 bg-gradient-to-b from-belmondo-green to-belmondo-darkgreen border-b border-belmondo-gold/10 overflow-hidden">
        <div class="max-w-4xl mx-auto text-center px-4 relative z-10">
            <span class="text-belmondo-gold text-xs font-bold tracking-widest uppercase mb-2 inline-block border-b border-belmondo-gold/30 pb-1">الفخامة والأناقة المنزلية</span>
            <h2 class="text-3xl md:text-5xl font-black mb-4 gold-gradient-text leading-tight">مفروشات بيلموندو الفاخرة</h2>
            <p class="text-slate-300 text-sm md:text-base font-light max-w-2xl mx-auto">تشكيلة حصرية من الأثاث العصري والديكورات الراقية المصممة بعناية لتناسب أرقى الأذواق</p>
        </div>
    </section>

    <!-- Main Content Grid -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-20 text-belmondo-gold/60">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
                <p class="text-sm font-light">جاري تحميل تشكيلة الأثاث...</p>
            </div>
        </div>
    </main>

    <!-- Admin Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-belmondo-cardbg border border-belmondo-gold/30 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-5 border-b border-belmondo-gold/20 flex justify-between items-center bg-belmondo-darkgreen">
                <h3 class="font-bold text-lg text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-belmondo-gold"></i>
                    <span>إدارة المعرض والمنتجات</span>
                </h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="p-6 overflow-y-auto space-y-6">
                <!-- Add Form -->
                <form id="productForm" onsubmit="saveProduct(event)" class="space-y-4 bg-belmondo-darkgreen/60 p-4 rounded-xl border border-belmondo-gold/10">
                    <h4 class="text-sm font-bold text-belmondo-gold mb-2">إضافة منتج جديد</h4>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">اسم الصنف / القطعة</label>
                        <input type="text" id="pName" required class="w-full bg-belmondo-darkgreen border border-belmondo-gold/30 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-belmondo-gold">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">السعر (دج)</label>
                            <input type="number" id="pPrice" required class="w-full bg-belmondo-darkgreen border border-belmondo-gold/30 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-belmondo-gold">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">الصور (اختر صورة أو أكثر)</label>
                            <input type="file" id="pImageFile" accept="image/*" multiple class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-belmondo-gold file:text-belmondo-darkgreen file:font-bold hover:file:opacity-90">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">الوصف التفصيلي</label>
                        <textarea id="pDesc" rows="2" class="w-full bg-belmondo-darkgreen border border-belmondo-gold/30 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-belmondo-gold"></textarea>
                    </div>
                    <button type="submit" id="saveBtn" class="w-full gold-gradient-bg text-belmondo-darkgreen font-bold py-2.5 rounded-lg text-sm transition hover:opacity-95 shadow-md">نشر المنتج في المعرض</button>
                </form>

                <!-- Manage List -->
                <div>
                    <h4 class="text-sm font-bold text-slate-300 mb-3">المنتجات الحالية المعروضة</h4>
                    <div id="adminProductsList" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase.js";
        import { getDatabase, ref, set, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://belmondo-furnituer-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const productsRef = ref(db, 'products');

        onValue(productsRef, (snapshot) => {
            const data = snapshot.val() || {};
            renderProducts(data);
            renderAdminList(data);
        });

        window.renderProducts = function(data) {
            const grid = document.getElementById('productsGrid');
            const keys = Object.keys(data);
            if (keys.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400"><p class="text-sm">لا توجد قطع معروضة حالياً. استخدم لوحة الإدارة لإضافة منتجاتك.</p></div>`;
                return;
            }

            grid.innerHTML = '';
            keys.forEach(key => {
                const p = data[key];
                const images = p.images || [];
                const mainImg = images[0] || 'https://via.placeholder.com/600x400/0a382c/c5a059?text=BELMONDO';

                grid.innerHTML += `
                    <div class="product-card bg-belmondo-cardbg border border-belmondo-gold/20 rounded-2xl overflow-hidden flex flex-col justify-between">
                        <div>
                            <div class="relative h-64 bg-belmondo-darkgreen overflow-hidden">
                                <img src="${mainImg}" class="w-full h-full object-cover transition transform duration-500 hover:scale-105" alt="${p.name}">
                                <div class="absolute top-3 right-3 gold-gradient-bg text-belmondo-darkgreen text-xs font-black px-3 py-1 rounded-full shadow-lg">
                                    ${p.price} دج
                                </div>
                            </div>
                            <div class="p-5">
                                <h3 class="text-lg font-bold text-white mb-2">${p.name}</h3>
                                <p class="text-slate-300 text-xs leading-relaxed line-clamp-3 mb-4">${p.desc || 'قطع أثاث فاخرة من تشكيلة بيلموندو المميزة.'}</p>
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <a href="https://wa.me/?text=مرحباً، أريد الاستفسار عن: ${encodeURIComponent(p.name)} - السعر: ${p.price} دج" target="_blank" class="w-full py-2.5 rounded-xl border border-belmondo-gold/40 text-belmondo-lightgold hover:bg-belmondo-gold hover:text-belmondo-darkgreen font-semibold text-xs transition duration-300 flex items-center justify-center gap-2">
                                <i class="fa-brands fa-whatsapp text-sm"></i>
                                <span>طلب واستفسار عبر واتساب</span>
                            </a>
                        </div>
                    </div>
                `;
            });
        };

        window.renderAdminList = function(data) {
            const list = document.getElementById('adminProductsList');
            const keys = Object.keys(data);
            if (keys.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-500 text-center">القائمة فارغة.</p>`;
                return;
            }

            list.innerHTML = '';
            keys.forEach(key => {
                const p = data[key];
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-belmondo-darkgreen p-3 rounded-lg border border-belmondo-gold/20 text-xs">
                        <span class="font-bold text-white truncate max-w-[200px]">${p.name}</span>
                        <div class="flex items-center gap-3">
                            <span class="text-belmondo-gold font-semibold">${p.price} دج</span>
                            <button onclick="deleteProduct('${key}')" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        };

        window.saveProduct = async function(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const desc = document.getElementById('pDesc').value;
            const fileInput = document.getElementById('pImageFile');

            const btn = document.getElementById('saveBtn');
            btn.innerText = "جاري النشر وتحديث البيانات...";
            btn.disabled = true;

            let images = [];
            if (fileInput.files.length > 0) {
                for (let file of fileInput.files) {
                    const base64 = await convertBase64(file);
                    images.push(base64);
                }
            }

            const newPostRef = push(productsRef);
            await set(newPostRef, { name, price, desc, images });

            document.getElementById('productForm').reset();
            btn.innerText = "نشر المنتج في المعرض";
            btn.disabled = false;
        };

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        window.deleteProduct = async function(key) {
            if (confirm("هل تريد حذف هذا المنتج نهائياً؟")) {
                await remove(ref(db, 'products/' + key));
            }
        };
    </script>

    <!-- Admin Actions -->
    <script>
        function openAdminModal() {
            const pass = prompt("كلمة سر لوحة التحكم:");
            if (pass === "0") {
                document.getElementById('adminModal').classList.remove('hidden');
            } else if (pass !== null) {
                alert("كلمة المرور خاطئة!");
            }
        }
        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }
    </script>
</body>
</html>
