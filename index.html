<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BELMONDO - أثاث فاخر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-gradient { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-bg { background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="glass sticky top-0 z-50 px-4 py-3 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-2xl font-black gold-gradient tracking-wider">BELMONDO</span>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="openAdminLogin()" class="glass px-3 py-1.5 rounded-xl text-xs font-semibold text-yellow-400 hover:bg-yellow-500/20 transition flex items-center gap-1.5 border border-yellow-500/30">
                <i class="fa-solid fa-lock text-[10px]"></i> لوحة الإدارة
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-6 max-w-6xl">
        <!-- Hero Section -->
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-5xl font-black mb-2 gold-gradient">مفروشات بيلموندو الفاخرة</h1>
            <p class="text-slate-400 text-sm md:text-base">تصاميم عصرية تجمع بين الفخامة والراحة لمنزلك</p>
        </div>

        <!-- Products Grid -->
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- سيتم تعبئة المنتجات تلقائياً من قاعدة البيانات -->
            <div class="text-center col-span-full py-12 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>جاري تحميل المنتجات...</p>
            </div>
        </div>
    </main>

    <!-- Admin Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-lg rounded-2xl p-6 border border-slate-700 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold gold-gradient">لوحة تحكم المشرف</h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- Add Product Form -->
            <form id="productForm" onsubmit="saveProduct(event)" class="space-y-4 mb-6 border-b border-slate-700 pb-6">
                <input type="hidden" id="editIndex">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">اسم القطعة أو الصنف</label>
                    <input type="text" id="pName" required class="w-full glass bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">السعر (دج)</label>
                    <input type="number" id="pPrice" required class="w-full glass bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">الوصف</label>
                    <textarea id="pDesc" rows="2" class="w-full glass bg-slate-900/50 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-yellow-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">صور المنتجات (اختر صورة أو عدة صور من هاتفك)</label>
                    <input type="file" id="pImageFile" accept="image/*" multiple class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-yellow-500/20 file:text-yellow-400 hover:file:bg-yellow-500/30">
                </div>
                <button type="submit" id="saveBtn" class="w-full gold-bg text-slate-950 font-bold py-2.5 rounded-xl text-sm transition shadow-lg">إضافة المنتج للموقع</button>
            </form>

            <!-- Products Management List -->
            <div>
                <h4 class="text-sm font-semibold text-slate-300 mb-3">المنتجات الحالية</h4>
                <div id="adminProductsList" class="space-y-2">
                    <!-- قائمة المنتجات المحذوفة/المعدلة -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase.js";
        import { getDatabase, ref, set, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://belmondo-furnituer-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const productsRef = ref(db, 'products');

        let productsData = {};

        // الاستماع الفوري للتغييرات من قاعدة البيانات
        onValue(productsRef, (snapshot) => {
            productsData = snapshot.val() || {};
            renderProducts(productsData);
            renderAdminList(productsData);
        });

        // عرض المنتجات للزوار
        window.renderProducts = function(data) {
            const grid = document.getElementById('productsGrid');
            const keys = Object.keys(data);
            if (keys.length === 0) {
                grid.innerHTML = `<div class="text-center col-span-full py-12 text-slate-500"><p>لا توجد منتجات مضافة حالياً.</p></div>`;
                return;
            }

            grid.innerHTML = '';
            keys.forEach(key => {
                const p = data[key];
                const images = p.images || [];
                const mainImg = images[0] || 'https://via.placeholder.com/400x300?text=Belmondo';

                grid.innerHTML += `
                    <div class="glass rounded-2xl overflow-hidden border border-slate-800 shadow-xl flex flex-col">
                        <div class="relative h-56 bg-slate-800">
                            <img src="${mainImg}" class="w-full h-full object-cover" alt="${p.name}">
                            <div class="absolute bottom-2 right-2 gold-bg text-slate-950 text-xs font-bold px-2.5 py-1 rounded-lg">
                                ${p.price} دج
                            </div>
                        </div>
                        <div class="p-4 flex flex-col flex-grow">
                            <h3 class="text-lg font-bold mb-1 text-white">${p.name}</h3>
                            <p class="text-slate-400 text-xs mb-4 flex-grow">${p.desc || ''}</p>
                            <a href="https://wa.me/?text=مرحباً، أريد الاستفسار عن منتج: ${encodeURIComponent(p.name)} - السعر: ${p.price} دج" target="_blank" class="w-full text-center bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 font-semibold py-2 rounded-xl text-xs hover:bg-emerald-600/30 transition flex items-center justify-center gap-1.5">
                                <i class="fa-brands fa-whatsapp text-sm"></i> طلب عبر واتساب
                            </a>
                        </div>
                    </div>
                `;
            });
        };

        // عرض قائمة الإدارة للحذف أو التعديل
        window.renderAdminList = function(data) {
            const list = document.getElementById('adminProductsList');
            const keys = Object.keys(data);
            if (keys.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-500 text-center py-2">لا توجد منتجات مسجلة.</p>`;
                return;
            }

            list.innerHTML = '';
            keys.forEach(key => {
                const p = data[key];
                list.innerHTML += `
                    <div class="flex justify-between items-center glass p-2.5 rounded-xl border border-slate-800 text-xs">
                        <span class="font-semibold text-slate-200 truncate max-w-[180px]">${p.name}</span>
                        <div class="flex gap-2">
                            <button onclick="deleteProduct('${key}')" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        };

        // حفظ منتج جديد مع تحويل الصور إلى Base64
        window.saveProduct = async function(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const desc = document.getElementById('pDesc').value;
            const fileInput = document.getElementById('pImageFile');

            const btn = document.getElementById('saveBtn');
            btn.innerText = "جاري الرفع...";
            btn.disabled = true;

            let images = [];
            if (fileInput.files.length > 0) {
                for (let file of fileInput.files) {
                    const base64 = await convertBase64(file);
                    images.push(base64);
                }
            }

            const newPostRef = push(productsRef);
            await set(newPostRef, { name, price, desc, images });

            document.getElementById('productForm').reset();
            btn.innerText = "إضافة المنتج للموقع";
            btn.disabled = false;
            alert("تم إضافة المنتج بنجاح وتحديثه فوراً!");
        };

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        window.deleteProduct = async function(key) {
            if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
                await remove(ref(db, 'products/' + key));
            }
        };
    </script>

    <!-- Admin Protection & UI Control -->
    <script>
        function openAdminLogin() {
            const pass = prompt("أدخل كلمة المرور الخاصة بلوحة الإدارة:");
            if (pass === "0") {
                document.getElementById('adminModal').classList.remove('hidden');
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }
        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }
    </script>
</body>
</html>
